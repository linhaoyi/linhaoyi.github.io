<script>
  (function() {
    function applySCP() {
      var bg = document.getElementById('dynamic-bg');
      if (bg) bg.style.display = 'none';

      var board = document.getElementById('board');
      if (board) {
        board.style.cssText = '';
        board.style.setProperty('backdrop-filter', 'none', 'important');
        board.style.setProperty('-webkit-backdrop-filter', 'none', 'important');
        board.style.setProperty('background', 'rgba(10, 12, 15, 0.85)', 'important');
        board.style.setProperty('background-image', 'none', 'important');
        board.style.setProperty('border-radius', '0', 'important');
        board.style.setProperty('box-shadow', 'none', 'important');
        board.style.setProperty('padding', '2rem', 'important');
        board.style.setProperty('border', '1px solid #2a2e35', 'important');
      }

      var elements = document.querySelectorAll('header, footer, .navbar, .sidebar, .footer, .page-header, .page-footer');
      for (var i = 0; i < elements.length; i++) {
        elements[i].style.setProperty('background', 'rgba(10, 12, 15, 0.85)', 'important');
        elements[i].style.setProperty('background-image', 'none', 'important');
      }

      
      document.body.classList.add('scp-archive');
      document.body.style.backgroundColor = '#0a0c0f';
      document.body.style.backgroundImage = 'none';

      
      if (!document.querySelector('.noise-overlay')) {
        var noiseDiv = document.createElement('div');
        noiseDiv.className = 'noise-overlay';
        document.body.appendChild(noiseDiv);
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', applySCP);
    } else {
      applySCP();
    }
    setTimeout(applySCP, 200);
    setTimeout(applySCP, 800);
  })();
</script>
